spring.application.name=demo
server.error.include-message=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:true}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpirationMs=${JWT_EXPIRATION_MS:30002230946}
spring.app.jwtCookieName=${JWT_COOKIE_NAME:PaimanaBackend}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/manager}
spring.datasource.username=${DATASOURCE_USER:postgres}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}
server.port=${SERVER_PORT:8000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200,http://localhost:8000,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:4200,http://127.0.0.1:8000}
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-2.5-flash
frontend.url=${FRONTEND_URL:http://localhost:3000}
# Configure Cloudinary through environment variables if enabled.

