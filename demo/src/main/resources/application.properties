spring.application.name=demo
spring.web.error.include-message=always
spring.jpa.defer-datasource-initialization=true

spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL}


spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpirationMs=${JWT_EXPIRATION_MS}
spring.app.jwtCookieName=${JWT_COOKIE_NAME}

spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT}
server.port=${SERVER_PORT}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-2.5-flash
frontend.url=${FRONTEND_URL}
# Configure Cloudinary through environment variables if enabled.
spring.datasource.url=${DBURL}
spring.datasource.username=${DBname}
spring.datasource.password=${DBPass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
