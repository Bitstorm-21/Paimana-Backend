spring.application.name=${APP_NAME:demo}
spring.web.error.include-message=${SPRING_WEB_ERROR_INCLUDE_MESSAGE:always}
spring.jpa.defer-datasource-initialization=${SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION:true}

spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:true}

spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpirationMs=${JWT_EXPIRATION_MS}
spring.app.jwtCookieName=${JWT_COOKIE_NAME}

spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
server.port=${SERVER_PORT:3000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=${GEMINI_CHAT_MODEL:gemini-2.5-flash}

frontend.url=${FRONTEND_URL}

# ML Service URL (FastAPI Sentinel)
ml.service.url=${ML_SERVICE_URL}

# Database Configuration
spring.datasource.url=${DBURL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DBPass}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}